<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="ao" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
    <marker id="ac" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0891b2"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="#ffffff" rx="10"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="600" letter-spacing="3">RENEF HOOK ENGINE</text>
  <line x1="470" y1="48" x2="730" y2="48" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- ======== TRAMPOLINE ======== -->
  <text x="60" y="90" fill="#b45309" font-size="12" font-weight="600" letter-spacing="2">TRAMPOLINE HOOK</text>
  <text x="60" y="105" fill="#94a3b8" font-size="9" letter-spacing="1">inline patching — default hook type</text>

  <!-- Target Function -->
  <rect x="60" y="125" width="200" height="130" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="148" text-anchor="middle" fill="#475569" font-size="9" font-weight="600" letter-spacing="1">TARGET FUNCTION</text>
  <line x1="75" y1="156" x2="245" y2="156" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="80" y="176" fill="#dc2626" font-size="9">MOV X0, X1</text>
  <text x="200" y="176" fill="#dc2626" font-size="7" opacity="0.7">overwritten</text>
  <text x="80" y="194" fill="#dc2626" font-size="9">STP X29, X30, [SP]</text>
  <text x="200" y="194" fill="#dc2626" font-size="7" opacity="0.7">overwritten</text>
  <text x="80" y="212" fill="#b45309" font-size="9" font-weight="600">BR → hook_handler</text>
  <line x1="75" y1="222" x2="245" y2="222" stroke="#e2e8f0" stroke-width="0.3" stroke-dasharray="3,3"/>
  <text x="80" y="240" fill="#94a3b8" font-size="9">ADD X2, X0, #0x10 ...</text>

  <path d="M 262 200 L 370 200" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)" fill="none"/>
  <text x="316" y="193" text-anchor="middle" fill="#b45309" font-size="7" letter-spacing="1">JUMP</text>

  <!-- Hook Handler -->
  <rect x="380" y="125" width="220" height="130" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="0.8"/>
  <text x="490" y="148" text-anchor="middle" fill="#b45309" font-size="9" font-weight="600" letter-spacing="1">HOOK HANDLER</text>
  <line x1="395" y1="156" x2="585" y2="156" stroke="#d97706" stroke-width="0.3"/>
  <text x="400" y="178" fill="#92400e" font-size="9">onEnter(args)</text>
  <text x="520" y="178" fill="#94a3b8" font-size="8">→ inspect args</text>
  <text x="400" y="200" fill="#1e293b" font-size="9">call original()</text>
  <text x="520" y="200" fill="#94a3b8" font-size="8">→ trampoline</text>
  <text x="400" y="222" fill="#92400e" font-size="9">onLeave(retval)</text>
  <text x="520" y="222" fill="#94a3b8" font-size="8">→ modify return</text>

  <path d="M 602 200 L 710 200" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)" fill="none"/>
  <text x="656" y="193" text-anchor="middle" fill="#b45309" font-size="7" letter-spacing="1">CALL</text>

  <!-- Trampoline Buffer -->
  <rect x="720" y="125" width="220" height="130" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="0.8"/>
  <text x="830" y="148" text-anchor="middle" fill="#059669" font-size="9" font-weight="600" letter-spacing="1">TRAMPOLINE BUFFER</text>
  <line x1="735" y1="156" x2="925" y2="156" stroke="#059669" stroke-width="0.3"/>
  <text x="740" y="178" fill="#166534" font-size="9">MOV X0, X1</text>
  <text x="880" y="178" fill="#94a3b8" font-size="7">saved</text>
  <text x="740" y="196" fill="#166534" font-size="9">STP X29, X30, [SP]</text>
  <text x="880" y="196" fill="#94a3b8" font-size="7">saved</text>
  <line x1="735" y1="206" x2="925" y2="206" stroke="#e2e8f0" stroke-width="0.3" stroke-dasharray="3,3"/>
  <text x="740" y="224" fill="#059669" font-size="9" font-weight="500">BR original + 0x0C</text>
  <text x="880" y="224" fill="#94a3b8" font-size="7">resume</text>

  <path d="M 830 257 C 830 278, 160 278, 160 257" stroke="#059669" stroke-width="1.2" marker-end="url(#ag)" fill="none" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="500" y="285" text-anchor="middle" fill="#059669" font-size="7" letter-spacing="1">RESUME EXECUTION @ original+0x0C</text>

  <!-- Summary -->
  <rect x="960" y="130" width="210" height="120" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="980" y="155" fill="#b45309" font-size="8" font-weight="600" letter-spacing="1">CHARACTERISTICS</text>
  <text x="980" y="176" fill="#64748b" font-size="8">▪ Patches function prologue</text>
  <text x="980" y="194" fill="#64748b" font-size="8">▪ Capstone disassembly engine</text>
  <text x="980" y="212" fill="#64748b" font-size="8">▪ Works on any function</text>
  <text x="980" y="230" fill="#64748b" font-size="8">▪ Default hook type</text>

  <!-- Divider -->
  <line x1="60" y1="305" x2="1140" y2="305" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- ======== PLT/GOT ======== -->
  <text x="60" y="340" fill="#0e7490" font-size="12" font-weight="600" letter-spacing="2">PLT / GOT HOOK</text>
  <text x="60" y="355" fill="#94a3b8" font-size="9" letter-spacing="1">pointer redirection — no code modification</text>

  <rect x="60" y="375" width="160" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="140" y="398" text-anchor="middle" fill="#475569" font-size="9" font-weight="600" letter-spacing="1">CALLER</text>
  <line x1="75" y1="406" x2="205" y2="406" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="80" y="426" fill="#1e293b" font-size="9">BL printf@PLT</text>
  <text x="80" y="444" fill="#94a3b8" font-size="8">call external symbol</text>

  <path d="M 222 415 L 290 415" stroke="#0891b2" stroke-width="1.5" marker-end="url(#ac)" fill="none"/>

  <rect x="300" y="375" width="180" height="80" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="0.8"/>
  <text x="390" y="398" text-anchor="middle" fill="#0e7490" font-size="9" font-weight="600" letter-spacing="1">PLT ENTRY</text>
  <line x1="315" y1="406" x2="465" y2="406" stroke="#0891b2" stroke-width="0.3"/>
  <text x="315" y="426" fill="#155e75" font-size="9">ADRP X16, GOT_page</text>
  <text x="315" y="444" fill="#155e75" font-size="9">LDR X17, [X16, #off]</text>

  <path d="M 482 415 L 550 415" stroke="#0891b2" stroke-width="1.5" marker-end="url(#ac)" fill="none"/>
  <text x="516" y="408" text-anchor="middle" fill="#0e7490" font-size="7" letter-spacing="1">LOAD</text>

  <rect x="560" y="370" width="190" height="90" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="655" y="393" text-anchor="middle" fill="#6d28d9" font-size="9" font-weight="600" letter-spacing="1">GOT TABLE</text>
  <line x1="575" y1="400" x2="735" y2="400" stroke="#7c3aed" stroke-width="0.3"/>
  <text x="580" y="418" fill="#94a3b8" font-size="8">malloc:  0x7fa4c01230</text>
  <text x="580" y="436" fill="#dc2626" font-size="8" font-weight="600">printf:  → hook_handler</text>
  <text x="580" y="452" fill="#94a3b8" font-size="8">open:    0x7fa4b82100</text>

  <path d="M 752 420 L 820 420" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <text x="786" y="412" text-anchor="middle" fill="#dc2626" font-size="7" font-weight="600" letter-spacing="1">REDIRECT</text>

  <rect x="830" y="375" width="180" height="80" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="0.8"/>
  <text x="920" y="398" text-anchor="middle" fill="#0e7490" font-size="9" font-weight="600" letter-spacing="1">HOOK HANDLER</text>
  <line x1="845" y1="406" x2="995" y2="406" stroke="#0891b2" stroke-width="0.3"/>
  <text x="845" y="426" fill="#155e75" font-size="9">onEnter(args)</text>
  <text x="845" y="444" fill="#155e75" font-size="9">onLeave(retval)</text>

  <path d="M 920 457 C 920 480, 1080 480, 1080 457" stroke="#059669" stroke-width="1.2" marker-end="url(#ag)" fill="none" stroke-dasharray="5,3"/>
  <text x="1000" y="487" text-anchor="middle" fill="#059669" font-size="7" letter-spacing="1">CALL REAL</text>

  <rect x="1030" y="375" width="120" height="80" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="0.8"/>
  <text x="1090" y="400" text-anchor="middle" fill="#059669" font-size="9" font-weight="600" letter-spacing="1">REAL printf</text>
  <line x1="1045" y1="408" x2="1135" y2="408" stroke="#059669" stroke-width="0.3"/>
  <text x="1050" y="428" fill="#166534" font-size="8">@ 0x7fa4c01230</text>
  <text x="1050" y="446" fill="#94a3b8" font-size="8">original impl.</text>

  <text x="1160" y="492" text-anchor="end" fill="#cbd5e1" font-size="8" letter-spacing="2">RENEF.IO</text>
</svg>